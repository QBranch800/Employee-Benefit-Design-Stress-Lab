[server]
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
font = "Geist, sans-serif"
headingFont = "Geist, sans-serif"
codeFont = "'Geist Mono', monospace"
baseFontSize = 15
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
linkUnderline = false
headingFontSizes = ["2rem", "1.375rem", "1.0625rem", "1rem", "0.9375rem", "0.875rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]

[theme.light]
primaryColor = "#2167AE"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAFAFA"
textColor = "#171717"
linkColor = "#2167AE"
borderColor = "#EAEAEA"
dataframeHeaderBackgroundColor = "#FAFAFA"
chartCategoricalColors = ["#8F8F8F", "#2167AE", "#E07B39", "#1F9E89"]

[theme.dark]
primaryColor = "#5B9BD9"
backgroundColor = "#0A0A0A"
secondaryBackgroundColor = "#161616"
textColor = "#EDEDED"
linkColor = "#7FB0E3"
borderColor = "#2A2A2A"
dataframeHeaderBackgroundColor = "#161616"
chartCategoricalColors = ["#8F8F8F", "#4F8FD0", "#D8743A", "#27A06F"]

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/Geist-Variable.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/Geist-Italic-Variable.woff2"
weight = "100 900"
style = "italic"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/GeistMono-Variable.woff2"
weight = "100 900"
style = "normal"
