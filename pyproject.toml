[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benefit-stress-lab"
version = "0.2.0"
description = "Interactive employee-benefits scenario modeller that compares employer cost, employee affordability, and distributional impact across health-plan designs using synthetic workforce data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "All rights reserved" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.20",
    "pydantic>=2.6",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
desktop = ["pyinstaller>=6.10", "pywebview>=5.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]
addopts = "-q"

[tool.ruff]
src = ["src", "app"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
